DEFAULT menu.c32
PROMPT 0
TIMEOUT 30

MENU TITLE Nova OS 1.00 26Q4 (Build 26110.0000) - Installation & Live Media
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #ffffffff #a0000000 std
MENU COLOR sel          7;37;40 #e0000000 #20ffffff all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std
MENU COLOR help         37;40   #c0ffffff #a0000000 std
MENU COLOR timeout_msg  37;40   #80ffffff #00000000 std
MENU COLOR timeout      1;37;40 #c0ffffff #00000000 std
MENU COLOR msg07        37;40   #90ffffff #a0000000 std

LABEL live
    MENU LABEL ^Start NovaOS (Live / RAM Disk)
    KERNEL memdisk
    INITRD /boot/novaos.img
    APPEND raw harddisk

LABEL install
    MENU LABEL ^Install NovaOS to Hard Drive
    MENU DEFAULT
    KERNEL /boot/vmlinuz
    INITRD /boot/initramfs.cpio.gz
    APPEND console=tty0 quiet noapic nolapic acpi=off

LABEL install_apic
    MENU LABEL ^Install NovaOS (with APIC - for newer hardware)
    KERNEL /boot/vmlinuz
    INITRD /boot/initramfs.cpio.gz
    APPEND console=tty0 quiet

LABEL install_safe
    MENU LABEL ^Install NovaOS (Safe Mode - VirtualBox / VMware)
    KERNEL /boot/vmlinuz
    INITRD /boot/initramfs.cpio.gz
    APPEND console=tty0 quiet noapic nolapic acpi=off pci=noacpi

LABEL bootfirst
    MENU LABEL ^Boot from First Hard Disk (Drive 0x80)
    COM32 chain.c32
    APPEND hd0

LABEL reboot
    MENU LABEL ^Reboot Computer
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL ^Power Off Computer
    COM32 poweroff.c32
